<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Page - Lehara</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Sofia">
  <style>
    * {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      box-sizing: border-box;
    }

    body {
      background: #fff;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #6d3a7a;
      padding: 20px 40px;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    nav ul li a {
      text-decoration: none;
      color: #000;
      font-weight: bold;
    }

    nav ul li a:hover {
      color: #fff;
    }

    .logo {
      height: 40px;
    }

    .contact {
      padding: 40px 60px;
      flex-grow: 1;
    }

    .contact h2 {
      font-size: 2.5rem;
      text-align: center;
      margin-bottom: 40px;
      color: #444;
    }

    form {
      display: flex;
      gap: 40px;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
      max-width: 1000px;
      margin: 0 auto;
    }

    .form-left,
    .form-right {
      flex: 1;
      min-width: 280px;
    }

    input,
    textarea {
      width: 100%;
      padding: 20px;
      font-size: 1rem;
      color: #2a2a2a;
      background: #f0edf3;
      border-radius: 1rem;
      border: 2px solid rgba(135, 107, 142, 0.555);
      margin-bottom: 20px;
      resize: none;
    }

    .form-right {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .button {
      background: #212121;
      padding: 12px 24px;
      font-weight: bold;
      color: #fff;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.3s;
      align-self: flex-start;
    }

    .button:hover {
      color: rgb(108, 66, 147);
      transform: scale(0.95);
    }

    footer {
      width: 100%;
      text-align: center;
      padding: 20px;
      background-color: #6d3a7a;
      color: #fff;
    }

    @media (max-width: 768px) {
      form {
        flex-direction: column;
        gap: 20px;
      }

      .form-right {
        align-items: center;
      }

      .button {
        align-self: center;
      }
    }
  </style>
</head>
<body>
  <div class="hero">
    <nav>
      <img src="LJ_logo.jpeg" class="logo" alt="Logo">
      <ul>
        <li><a href="index.html">HOME</a></li>
        <li><a href="about.html">ABOUT</a></li>
        <li><a href="projects.html">PROJECTS</a></li>
        <li><a href="contact.html">CONTACT</a></li>
      </ul>
    </nav>

    <section class="contact" id="contact">
      <h2>Contact Me</h2>

      <form action="https://formsubmit.co/leharachamee20@gmail.com" method="POST">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">

        <div class="form-left">
          <input type="text" name="Full Name" placeholder="Full Name" required>
          <input type="email" name="Email" placeholder="Email" required>
          <input type="text" name="Phone" placeholder="Phone Number">
          <input type="text" name="Subject" placeholder="Subject">
        </div>

        <div class="form-right">
          <textarea name="Message" placeholder="Your Message" rows="10" required></textarea>
          <input type="submit" value="Send Message" class="button">
        </div>
      </form>
    </section>

    <footer>
      <p>&copy; 2025 Lehara Jayasena. All rights reserved.</p>
    </footer>
  </div>
</body>
</html>
